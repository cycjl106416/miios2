name: Build IPA (TrollStore / 未签名)

# 触发方式：
# 1. push 到 main 分支，或
# 2. 在仓库 Actions 页面手动点 Run workflow

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    # 免费的云端 Mac（GitHub 官方 runner）
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 查看 Xcode 版本
        run: xcodebuild -version

      - name: 编译（关闭签名，产出 arm64 iOS 可执行文件）
        run: |
          xcodebuild \
            -project MiSound.xcodeproj \
            -target MiSound \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build \
            build

      - name: 打 IPA 包（Payload/MiSound.app）
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MiSound.app Payload/
          # ditto 保留文件权限/符号链接，TrollStore 可正常安装
          ditto -c -k --keepParent Payload MiSound-TrollStore.ipa
          ls -la MiSound-TrollStore.ipa

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: MiSound-TrollStore-ipa
          path: MiSound-TrollStore.ipa
          if-no-files-found: error
